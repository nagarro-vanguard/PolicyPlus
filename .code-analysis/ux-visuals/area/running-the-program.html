- When the program starts, the sources for user and computer policies saved last time are opened. If opening them fails, the user is told &quot;The previous policy sources are not accessible. The defaults will be loaded.&quot;, both sources are reset to the local group policy object, and those defaults are opened instead. (PolicyPlus/Main.vb:25)
- Saved definitions folder is opened at start. If the folder loads with errors, the user is shown the errors and asked whether to continue; answering No discards the folder. (PolicyPlus/Main.vb:62)
- When the saved definitions folder cannot be used and is not the Windows default folder, the user is offered the default folder instead. Answering No shows no further message and leaves the workspace empty. Answering Yes saves the default as the saved source before loading it, so it stays saved even if loading fails. Errors found loading the default are only reported, with no question to continue. If the default throws, or the failing folder was the default, the user is told &quot;Policy definitions could not be loaded: &quot; followed by the reason, and the workspace stays empty. (PolicyPlus/Main.vb:64)
- The category list shows an &quot;Up: &quot; parent entry (when a parent exists), then listed subcategories, then listed policies, each sorted by display name. The selected policy stays selected on refresh. (PolicyPlus/Main.vb:105)

- A category is an orphan when it has no parent loaded but its definition names a parent. (PolicyPlus/Main.vb:170)
- A category is empty when it has no subcategories and no policies. (PolicyPlus/Main.vb:173)
